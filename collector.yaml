receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

exporters:
  awsxray:
    # The region is automatically detected from the Lambda environment

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [awsxray]
